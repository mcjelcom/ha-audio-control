site_name: Audio Control for Home Assistant
site_description: Control RS232 and network audio amplifiers from Home Assistant — installation, setup and reference.
site_url: https://haac.mcjel.com/
repo_url: https://github.com/mcjelcom/ha-audio-control
repo_name: mcjelcom/ha-audio-control
edit_uri: edit/main/docs/
copyright: A <a href="https://mcjel.com">McJEL, LLC</a> project · MIT License

theme:
  name: material
  variant: modern
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: material/web
      link: https://mcjel.com
      name: McJEL
    - icon: fontawesome/brands/github
      link: https://github.com/mcjelcom/ha-audio-control
      name: Source on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Supported models: supported-models.md
  - Compatibility: compatibility.md
  - Step-by-step guide:
      - 1. What you need: getting-started/prerequisites.md
      - Choose how to install: getting-started/choose-install.md
      - 2. Install Home Assistant: getting-started/install-home-assistant.md
      - 3. Install HACS: getting-started/install-hacs.md
      - 4. Install Audio Control: getting-started/install-audio-control.md
  - "Example: AMC X86i": examples/amc-x86i.md
  - Everyday use:
      - Using your zones: using-zones.md
      - Phone app: phone-app.md
      - Ready-made dashboard: dashboard.md
      - Names & settings: configuration.md
      - Automations & extra controls: services.md
      - Apple Home, Google Home & Alexa: smart-home.md
      - Matter (partial): matter.md
      - Help & troubleshooting: troubleshooting.md
  - For advanced users:
      - Install with balena (preview): getting-started/install-balena.md
      - Docker / Container installs: advanced/docker.md
      - Network connections: reference/network-transport.md
      - Adding a new device: reference/adding-a-device.md
      - Protocol types: reference/protocol-types.md

# Fail the (strict) build on broken links and #anchors (Zensical's keys; both
# are on by default -- stated explicitly so the intent survives upgrades).
validation:
  invalid_links: true
  invalid_link_anchors: true
