name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deliberately NOT `pip install -e`. An editable install writes an
          # __editable__ path hook into sys.path, and Home Assistant's component
          # loader walks sys.path stat-ing entries as directories -- every
          # config-flow test died with FileNotFoundError on
          # __editable__.ha_audio_control-1.1.0.finder.__path_hook__.
          #
          # This is a custom_components drop-in, not an importable distribution;
          # the tests import it by path from the repo root. So install the
          # dependency set only, never the project itself.
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check custom_components/audio_control/ tests/

      - name: Ruff format check
        run: ruff format --check custom_components/audio_control/ tests/

      - name: mypy (strict)
        run: mypy --strict custom_components/audio_control/

      - name: pytest
        run: pytest tests/ -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # HA's own manifest/strings validator. It catches things our lint cannot:
      # missing integration_type, malformed usb matchers, strings.json keys that
      # do not match the config flow, and unsupported manifest fields.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
