# Builds the documentation site from docs/ with MkDocs Material and publishes it
# to GitHub Pages (https://haac.mcjel.com/). Public content:
# the site is meant to be read anonymously.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/render-diagrams.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/render-diagrams.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-docs.txt
      # Diagrams: PlantUML (pinned + checksum-verified) renders the .puml sources
      # HERE, never as an external server at page-view time. Re-rendered on every
      # build (not --check: font metrics differ between macOS and Linux, so the
      # committed SVGs -- kept for github.com and local preview -- can't be
      # compared byte for byte).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: scripts/render-diagrams.sh
      # --strict: a broken link or missing page fails the build instead of shipping.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
