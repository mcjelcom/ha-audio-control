ca'">balenaEtcher</text><rect x="61.893" y="259" width="228.571" height="48" fill="#E3F2FD" style="stroke:#1E88E5;stroke-width:0.5;" rx="6" ry="6"/><text x="71.893" y="279.78" fill="#000" font-size="14" textLength="202.323" font-family="'Helvetica'">Put the card in the Raspberry Pi,</text><text x="71.893" y="293.78" fill="#000" font-size="14" textLength="208.571" font-family="'Helvetica'">connect network cable and power</text><rect x="23.362" y="327" width="305.633" height="48" fill="#E3F2FD" style="stroke:#1E88E5;stroke-width:0.5;" rx="6" ry="6"/><text x="33.362" y="347.78" fill="#000" font-size="14" textLength="139.282" font-family="'Helvetica'">Wait until the device is</text><text x="176.534" y="347.78" fill="#000" font-size="14" textLength="43.559" font-weight="700" font-family="'Helvetica'">Online</text><text x="33.362" y="361.78" fill="#000" font-size="14" textLength="285.633" font-family="'Helvetica'">and the update finishes (about 20-40 minutes)</text><rect x="16" y="395" width="320.357" height="48" fill="#E3F2FD" style="stroke:#1E88E5;stroke-width:0.5;" rx="6" ry="6"/><text x="26" y="415.78" fill="#000" font-size="14" textLength="165.327" font-family="'Helvetica'">Open the device's address</text><text x="26" y="429.78" fill="#000" font-size="14" textLength="146.262" font-weight="700" font-family="'Helvetica'">http://IP-address:8123</text><text x="176.151" y="429.78" fill="#000" font-size="14" textLength="150.206" font-family="'Helvetica'">and create your account</text><ellipse cx="176.179" cy="474" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="176.179" cy="474" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="176.179" y1="35" x2="176.179" y2="55" style="stroke:#1E88E5;stroke-width:1.6;"/><polygon points="172.179,45,176.179,55,180.179,45,176.179,49" fill="#1E88E5" style="stroke:#1E88E5;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="176.179" y1="103" x2="176.179" y2="123" style="s