blueprint:
  name: Audio Control - Scheduled Zone On
  description: >-
    Turn on a zone at a set time with a chosen source and volume — e.g. kitchen
    audio on weekday mornings.

    A short delay is inserted between power-on and the volume/source commands.
    Most RS232 amplifiers need a moment after powering a zone before they will
    accept further commands for it; without the delay the first command is
    often dropped.
  domain: automation
  author: McJEL, LLC
  source_url: https://github.com/mcjelcom/ha-audio-control/blob/main/blueprints/automation/audio_control/scheduled_zone_on.yaml
  input:
    zone:
      name: Zone
      description: The audio zone to turn on.
      selector:
        entity:
          filter:
            integration: audio_control
            domain: media_player
    on_time:
      name: Time
      description: Time of day to turn the zone on.
      default: "07:00:00"
      selector:
        time:
    weekdays:
      name: Days
      description: Days on which this runs.
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    volume:
      name: Volume
      description: Volume level to set after powering on.
      default: 0.25
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    source:
      name: Source
      description: >-
        Optional source to select, exactly as it appears in the zone's source
        list (e.g. "Source 1", or a custom name set in the integration options).
        Leave blank to keep the current source.
      default: ""
      selector:
        text:
    settle_delay:
      name: Settle delay
      description: Seconds to wait after power-on before sending volume/source.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 1
          unit_of_measurement: seconds

mode: single

# Bound here so the template in the `choose` below can test whether the
# optional source input was left blank.
variables:
  selected_source: !input source

trigger:
  - platform: time
    at: !input on_time

condition:
  - condition: time
    weekday: !input weekdays

action:
  - service: media_player.turn_on
    target:
      entity_id: !input zone
  - delay:
      seconds: !input settle_delay
  - service: media_player.volume_set
    target:
      entity_id: !input zone
    data:
      volume_level: !input volume
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ selected_source | trim != '' }}"
        sequence:
          - service: media_player.select_source
            target:
              entity_id: !input zone
            data:
              source: !input source
