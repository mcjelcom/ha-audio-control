# NAD C 368 / C 388 — Stereo Integrated Amplifier (single zone)
name: "NAD C 368 / C 388"
manufacturer: "NAD"
models: ["C368", "C388", "C658", "M10"]

zones: 1

serial:
  baud_rate: 115200
  data_bits: 8
  parity: "none"
  stop_bits: 1
  command_delay_ms: 100
  command_prefix: ""
  command_suffix: "\r"
  response_prefix: ""
  response_terminator: "\r"

commands:
  status:      "Main.Power?"
  power_on:    "Main.Power=On"
  power_off:   "Main.Power=Off"
  volume_set:  "Main.Volume={volume:+d}"
  volume_up:   "Main.Volume+"
  volume_down: "Main.Volume-"
  mute_on:     "Main.Mute=On"
  mute_off:    "Main.Mute=Off"
  source_set:  "Main.Source={source_name}"

response:
  status_pattern: "Main\\.(?P<field>\\w+)=(?P<value>.+)"
  error_response: "?"

  mapping:
    power:
      field: "value"
      type: "string_bool"
      on_value: "On"
      off_value: "Off"
    volume:
      field: "value"
      type: "signed_int"
    source:
      field: "value"
      type: "string"

volume:
  min: -80
  max: 0
  inverted: false  # -80=silent, 0=max (dB scale)

# Single mapping form: a duplicate top-level `sources:` key silently wins
# in YAML, which discarded the declared count and fell back to 6.
sources:
  count: 6
  names:
    1: "Stream"
    2: "Optical 1"
    3: "Optical 2"
    4: "Coaxial"
    5: "Analog 1"
    6: "Analog 2"
  command_map:
    1: "Stream"
    2: "Optical1"
    3: "Optical2"
    4: "Coaxial"
    5: "Analog1"
    6: "Analog2"

features:
  has_tone_controls: true
  has_group_mode: false
  has_all_off: false
  has_balance: false
  has_transport: false
  unsolicited_updates: false
